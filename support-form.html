<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Info Form</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 24px;
            width: 300px;
            box-shadow: 0 1px 3px rgba(31,35,40,0.12);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #24292f;
        }
        input[type="email"], select {
            width: 100%;
            padding: 5px 12px;
            font-size: 14px;
            line-height: 20px;
            color: #24292f;
            background-color: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input[type="email"]:focus, select:focus {
            background-color: #ffffff;
            border-color: #0969da;
            outline: none;
            box-shadow: 0 0 0 3px rgba(9,105,218,0.3);
        }
        button {
            width: 100%;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            color: #ffffff;
            background-color: #1f883d;
            border: 1px solid rgba(31,35,40,0.15);
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1a7f37;
        }
    </style>
</head>
<body>

<div class="form-container">
    <form action="#" method="POST">
        <div class="form-group">
            <label for="email">GitHub Email Address</label>
            <input type="email" id="email" name="email" required placeholder="example@github.com">
        </div>
        
        <div class="form-group">
            <label for="level">Select Level</label>
            <select id="level" name="level" required>
                <option value="" disabled selected>Choose a level</option>
                <option value="1">Level 1</option>
                <option value="2">Level 2</option>
                <option value="3">Level 3</option>
                <option value="4">Level 4</option>
                <option value="5">Level 5</option>
                <option value="6">Level 6</option>
            </select>
        </div>
        
        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
